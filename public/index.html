<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeCare Staffing | Nurse-Founded & Led Healthcare Staffing</title>
    <meta name="description" content="LifeCare Staffing connects healthcare facilities with compassionate professionals through nurse-led staffing, modern technology, and dedicated support." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="#" class="logo" id="logo">LifeCare <span>Staffing</span></a>
        <nav class="main-nav" id="main-nav"></nav>
        <a href="#jobs" class="btn btn-solid" id="apply-btn">Apply Now</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-overlay"></div>
        <img id="hero-image" alt="Healthcare professionals collaborating" class="hero-image" />
        <div class="container hero-content">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-title"></h1>
          <p id="hero-description"></p>
          <div class="hero-actions">
            <a id="hero-primary" class="btn btn-solid"></a>
            <a id="hero-secondary" class="btn btn-outline"></a>
          </div>
        </div>
      </section>

      <section class="quick-grid" id="services-section">
        <div class="container grid-cards" id="services-grid"></div>
      </section>

      <section class="about section" id="about-section">
        <div class="container two-col">
          <div>
            <p class="eyebrow" id="about-eyebrow"></p>
            <h2 id="about-title"></h2>
            <p id="about-description"></p>
          </div>
          <img id="about-image" alt="Nurse and physician discussing patient care" class="rounded-image" />
        </div>
      </section>

      <section class="leadership section" id="leadership-section">
        <div class="container">
          <p class="eyebrow center" id="leadership-eyebrow"></p>
          <h2 class="center" id="leadership-title"></h2>
          <p class="center section-subtitle" id="leadership-subtitle"></p>
          <div class="leaders-grid" id="leaders-grid"></div>
        </div>
      </section>

      <section class="jobs section" id="jobs-section">
        <div class="container jobs-wrap">
          <div>
            <p class="eyebrow" id="jobs-eyebrow"></p>
            <h2 id="jobs-title"></h2>
            <p id="jobs-description"></p>
            <div class="job-tags" id="jobs-tags"></div>
            <a id="jobs-cta" class="btn btn-solid"></a>
          </div>
          <img id="jobs-image" alt="Nurse reviewing digital schedule" class="rounded-image" />
        </div>
      </section>

      <section class="cta section" id="cta-section">
        <div class="container cta-box">
          <div>
            <h2 id="cta-title"></h2>
            <p id="cta-description"></p>
          </div>
          <a id="cta-button" class="btn btn-outline light"></a>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="footer-section">
      <div class="container footer-grid">
        <div>
          <a href="#" class="logo" id="footer-logo">LifeCare <span>Staffing</span></a>
          <p class="muted" id="footer-tagline"></p>
        </div>
        <div><h4>Contact</h4><p id="contact-phone"></p><p id="contact-email"></p></div>
        <div><h4>Office</h4><p id="office-line1"></p><p id="office-line2"></p></div>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
